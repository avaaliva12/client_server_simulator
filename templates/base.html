<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Client–Server Lab{% endblock %}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="{{ url_for('static',filename='css/style.css') }}" rel="stylesheet"></head><body><nav class="navbar navbar-expand-lg navbar-dark bg-dark"><div class="container"><a class="navbar-brand fw-semibold" href="/">◉ Client–Server Lab</a><button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="nav"><div class="navbar-nav ms-auto"><a class="nav-link" href="/">Dashboard</a><a class="nav-link" href="/simulator">Simulator</a><a class="nav-link" href="/history">Request history</a><a class="nav-link" href="/server-status">Server status</a></div></div></div></nav><main class="container py-4 py-lg-5">{% if page_error %}<div class="text-center py-5"><h1>{{ page_error }}</h1><p>{{ page_error_detail }}</p><a href="/" class="btn btn-primary">Dashboard</a></div>{% else %}{% block content %}{% endblock %}{% endif %}</main><footer class="container pb-4 text-secondary small">Local learning tool · Requests are handled by Flask</footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>{% block scripts %}{% endblock %}</body></html>
